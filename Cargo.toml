[workspace]
resolver = "2"
members = [
    "crates/imagesync-core",
    "crates/imagesync-tui",
    "crates/imagesync-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/eelih/imagesync"
authors = ["Eeli Hernesniemi <eeli.hernesniemi@gmail.com>"]

[workspace.dependencies]
# core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
walkdir = "2"
directories = "5"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sysinfo = "0.32"
num_cpus = "1"
once_cell = "1"

# cli
clap = { version = "4", features = ["derive"] }

# tui
ratatui = "0.30"
crossterm = "0.29"

# tests
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
